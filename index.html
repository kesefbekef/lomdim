<!doctype html>
<html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>לומדים בכיף עבר כתובת</title>
<style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#0a0420;color:#fff;font-family:system-ui,sans-serif;text-align:center;padding:20px}a{display:inline-block;margin-top:16px;background:linear-gradient(135deg,#ff2d95,#ff8a00);color:#fff;text-decoration:none;padding:14px 24px;border-radius:99px;font-weight:800}</style>
</head><body><div><div style="font-size:64px">🚚</div><h1>לומדים בכיף עבר לכתובת חדשה</h1><a href="https://lomdimbekef.github.io/">לכתובת החדשה ←</a></div>
<script>
// מנקים את מה שנשאר מהכתובת הישנה
try{navigator.serviceWorker&&navigator.serviceWorker.getRegistrations().then(rs=>rs.forEach(r=>{if(r.scope.indexOf('/lomdim/')>-1)r.unregister()}))}catch(e){}
try{caches.keys().then(ks=>ks.forEach(k=>{if(k.indexOf('lbk-')===0)caches.delete(k)}))}catch(e){}
// בתוך החלון של "כסף בכיף" חוזרים למסך של כסף. בדפדפן עוברים לכתובת החדשה
var inApp=matchMedia('(display-mode: standalone)').matches||navigator.standalone===true;
location.replace(inApp?'/':'https://lomdimbekef.github.io/');
</script></body></html>
